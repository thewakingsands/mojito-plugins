name: Official plugin packages
on:
  push:
    tags: ['official-v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:official
      - uses: actions/upload-artifact@v4
        with:
          name: official-build
          if-no-files-found: error
          path: |
            packages/plugin-sdk/dist
            packages/matcha/dist
            packages/plugin-skill-display/dist
            packages/combat-statistics/dist
            packages/plugin-raidboss/dist
            packages/deepseek-tts/dist
            packages/overlay-plugins/dist
            target/release/mojito-package
  sign:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: official-build
      - run: chmod +x target/release/mojito-package
      - name: Sign and verify official packages
        env:
          OFFICIAL_SIGNING_JWK: ${{ secrets.OFFICIAL_SIGNING_JWK }}
          OFFICIAL_SIGNER_FINGERPRINT: ${{ vars.OFFICIAL_SIGNER_FINGERPRINT }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          import path from 'node:path'
          writeFileSync(path.join(process.env.RUNNER_TEMP, 'official.jwk'), process.env.OFFICIAL_SIGNING_JWK, { mode: 0o600 })
          NODE
          pnpm pack:official "$RUNNER_TEMP/official.jwk" "$OFFICIAL_SIGNER_FINGERPRINT"
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/official.jwk"
      - uses: actions/upload-artifact@v4
        with:
          name: official-packages
          if-no-files-found: error
          path: |
            dist/official/*.mojito
            dist/official/SHA256SUMS
      - name: Upload release attachments
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/official/*.mojito dist/official/SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" --notes 'Official plugin packages; CI uploads drafts to Mojito server for publication through its administration interface.'
  upload:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: official-packages
          path: dist/official
      - name: Upload plugin drafts
        env:
          MOJITO_SERVER_URL: ${{ vars.MOJITO_SERVER_URL }}
        shell: bash
        run: |
          : "${MOJITO_SERVER_URL:?Missing MOJITO_SERVER_URL}"
          upload_url="${MOJITO_SERVER_URL%/}/api/admin/drafts"
          shopt -s nullglob
          packages=(dist/official/*.mojito)
          if (( ${#packages[@]} == 0 )); then
            echo 'No official plugin packages found'
            exit 1
          fi
          response="$RUNNER_TEMP/plugin-upload-response.json"
          for file in "${packages[@]}"; do
            echo "Uploading $file"
            token=$(curl --silent --show-error --fail --proto '=https' --get \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              --data-urlencode "audience=$upload_url" "$ACTIONS_ID_TOKEN_REQUEST_URL" \
              | jq -er '.value | strings | select(length > 0)')
            echo "::add-mask::$token"
            : > "$response"
            if ! status=$(curl --silent --show-error --fail-with-body --proto '=https' \
              -H "Authorization: Bearer $token" \
              -F "archive=@$file" -o "$response" -w '%{http_code}' \
              "$upload_url"); then
              cat "$response"
              exit 1
            fi
            cat "$response"
            case "$status" in
              200|201) ;;
              *) echo "Unexpected upload status: $status"; exit 1 ;;
            esac
          done

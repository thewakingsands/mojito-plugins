<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mojito 插件包</title>
<style>
:root { color-scheme:light dark; font:14px/1.6 system-ui,sans-serif; --bg:#fafbfa; --fg:#23272d; --line:#dde2de; --muted:#66716b; }
@media(prefers-color-scheme:dark) { :root { --bg:#181b1a; --fg:#e6eae7; --line:#3a413c; --muted:#a3aea6; } }
* { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--fg); } main { max-width:820px; margin:56px auto; padding:0 24px; } h1 { font-size:24px; margin:0 0 28px; } form { display:grid; gap:16px; } label { display:grid; gap:6px; } input { font:inherit; max-width:100%; } input[type=text] { padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); } button { justify-self:start; font:inherit; padding:8px 18px; border:0; border-radius:6px; background:#c5ec8c; color:#28391e; cursor:pointer; } button:disabled { opacity:.5; cursor:wait; } p { color:var(--muted); } #status { min-height:24px; } dl { display:grid; grid-template-columns:100px 1fr; gap:12px; } dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; } pre { border-top:1px solid var(--line); padding-top:20px; white-space:pre-wrap; overflow-wrap:anywhere; font-size:13px; } @media(max-width:600px) { main { margin:24px auto; } dl { grid-template-columns:1fr; gap:4px; } dd { margin-bottom:12px; } }
</style>
<main>
<h1>Mojito 插件包</h1>
<form id="form">
<label>插件包<input id="file" type="file" accept=".mojito" required></label>
<label>预期签名者指纹（可选）<input id="fingerprint" type="text" autocomplete="off" spellcheck="false" pattern="[a-f0-9]{64}" placeholder="SHA-256"></label>
<button id="verify" type="submit">查看并验签</button>
</form>
<p>文件在本机验证，不会上传。有效签名不代表发布者身份已经认证。</p>
<p id="status" role="status" aria-live="polite"></p>
<section id="result" hidden><dl id="summary"></dl><h2>元数据</h2><pre id="metadata"></pre></section>
</main>
<script type="module">
const worker = new Worker('./worker.js', { type:'module' })
const form = document.querySelector('#form'), file = document.querySelector('#file'), button = document.querySelector('#verify'), status = document.querySelector('#status'), result = document.querySelector('#result')
function busy(value) { button.disabled = value; file.disabled = value; document.querySelector('#fingerprint').disabled = value }
form.addEventListener('change', () => { result.hidden = true; status.textContent = '' })
function fail(error) { busy(false); status.textContent = `验证失败：${error}`; result.hidden = true }
form.addEventListener('submit', async (event) => {
  event.preventDefault(); result.hidden = true
  if (!file.files[0]) return
  if (file.files[0].size > 256*1024*1024) return fail('插件包超过 256 MiB')
  busy(true); status.textContent = '正在验证…'
  try { const bytes = await file.files[0].arrayBuffer(); worker.postMessage({ bytes, fingerprint:document.querySelector('#fingerprint').value }, [bytes]) } catch(error) { fail(error.message) }
})
worker.onmessage = ({ data }) => {
  if (data.error) return fail(data.error)
  busy(false); status.textContent = '签名与归档摘要通过'
  const { metadata, signer } = data.inspection
  const summary = document.querySelector('#summary'); summary.replaceChildren()
  for (const [label, value] of [['名称', metadata.manifest.name], ['版本', metadata.manifest.version], ['签名者指纹', signer.fingerprint], ['运行方式', metadata.manifest.entry.kind === 'native' ? '解包运行' : '从压缩包读取']]) {
    const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = label; dd.textContent = value; summary.append(dt,dd)
  }
  document.querySelector('#metadata').textContent = JSON.stringify(metadata,null,2); result.hidden = false
}
worker.onerror = (event) => fail(event.message)
</script>
</html>

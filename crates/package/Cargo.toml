[package]
name = "mojito-package"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "mojito-package"
path = "src/main.rs"
required-features = ["codec"]

[features]
default = ["codec"]
codec = ["dep:sevenz-rust2", "sevenz-rust2/compress"]
ffi = ["codec"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sevenz-rust2 = { version = "=0.24.1", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
